name: Feature request
description: An idea or something you'd like the games to do on the Switch.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? What would it help with?
    validations:
      required: true
  - type: dropdown
    id: games
    attributes:
      label: Which games is it for?
      multiple: true
      options:
        - Black
        - White
        - Black 2
        - White 2
        - HeartGold
        - SoulSilver
        - All of them
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this hasn't been requested yet.
          required: true
