name: Bug report
description: Something doesn't work on the Switch (starting, the picture, battles, menus, saving...).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The `game.log` file is the most useful part: without it most problems can't be tracked down.
        **Never attach or link your ROM.**
  - type: dropdown
    id: download
    attributes:
      label: Which download?
      options:
        - All six games in one (pokemon-ds-wide)
        - Black 2 and White 2
        - Black and White
        - SoulSilver and HeartGold
        - I built it myself
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release
      description: The release you downloaded, from its page on GitHub.
      placeholder: all-games-v2
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Which game?
      options:
        - Black
        - White
        - Black 2
        - White 2
        - HeartGold
        - SoulSilver
    validations:
      required: true
  - type: dropdown
    id: rom
    attributes:
      label: Your ROM's version
      description: "Black, White, Black 2 and White 2 need an English copy (US or Europe); SoulSilver and HeartGold the English US copy. A white or black screen at the start usually means another version or a changed ROM."
      options:
        - English, US
        - English, Europe
        - Another language
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: switch
    attributes:
      label: Switch
      options:
        - Switch (original)
        - Switch OLED
        - Switch Lite
        - Other
    validations:
      required: true
  - type: dropdown
    id: start
    attributes:
      label: How do you start it?
      options:
        - Homebrew Menu, holding R on a game
        - A forwarder on the HOME Menu (sphaira or similar)
        - From the album
        - Other
    validations:
      required: true
  - type: input
    id: clocks
    attributes:
      label: sys-clk settings (if you use it)
      placeholder: CPU 1785 / GPU 460 / memory 1600, or none
  - type: dropdown
    id: where
    attributes:
      label: Where does it go wrong?
      options:
        - Starting (a white or black screen, an error, back to the menu)
        - The game list (all-games download)
        - Walking around (the widescreen world)
        - Battles
        - Menus, the bag, text boxes
        - Saving or loading
        - Sound
        - Controls
        - Speed (slow or stuttering)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what did you expect?
      description: A photo or a short video of the screen helps a lot (the Switch's screenshot button works too).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      description: Where in the game you are and what you do, so it can be tried here.
      placeholder: |
        1. Continue my save in Castelia City
        2. Open the Bag
        3. ...
  - type: textarea
    id: log
    attributes:
      label: game.log
      description: |
        Drag the `game.log` file into this box (or paste what is in it). It is in the game's folder on the SD card: `/switch/pokemon-ds-wide/` for the all-games download, otherwise the game's own folder (e.g. `/switch/pokemon-black2-wide/`). It is written again each time the game starts, so copy it straight after the problem.
        To get it onto a computer: put the SD card in a card reader; or, without taking it out, Hekate's **Tools > USB Tools > SD Card** (or DBI's MTP mode) shows the card on the computer over USB; or an FTP app such as ftpd over Wi-Fi.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this hasn't been reported yet.
          required: true
        - label: My ROM is my own unchanged copy (no patches, translations, randomizers or trimming).
          required: true
